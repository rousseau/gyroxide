[workspace]
resolver = "2"
members = [
    "crates/gyroxide-mesh",
    "crates/gyroxide-model",
    "crates/gyroxide-sim",
    "crates/gyroxide-cli",
    "crates/gyroxide-validate",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
gyroxide-mesh = { path = "crates/gyroxide-mesh" }
gyroxide-model = { path = "crates/gyroxide-model" }
gyroxide-sim = { path = "crates/gyroxide-sim" }
gyroxide-validate = { path = "crates/gyroxide-validate" }
burn = { version = "0.21.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 2
