name: CI

# Format, lints et tests sur CPU, Linux et macOS. Les tests GPU (#[ignore = "gpu"]) se lancent à la main.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `gyroxide eval` et ses tests : les métriques sont en Python (tools/scorecard.py)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy nibabel matplotlib
      - run: python -m unittest discover -s tools/tests -v
      - run: cargo fmt --all --check
      # `--features autodiff` : l'exemple adjoint_week (adjoint, test des gradients en f64 contre différences finies)
      - run: cargo clippy --all-targets --features autodiff -- -D warnings
      - run: cargo test --release --features autodiff
