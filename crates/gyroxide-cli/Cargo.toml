[package]
name = "gyroxide-cli"
description = "Command-line driver for gyroxide"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "gyroxide"
path = "src/main.rs"

[dependencies]
gyroxide-mesh.workspace = true
gyroxide-model.workspace = true
gyroxide-sim.workspace = true
gyroxide-validate.workspace = true
gyroxide-io.workspace = true
surfoxide-core.workspace = true
surfoxide-io.workspace = true
burn = { workspace = true, features = ["ndarray"] }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true

[features]
default = ["wgpu"]
# wgpu picks Metal / Vulkan / DX12 natively; fusion merges element-wise chains.
wgpu = ["burn/wgpu", "burn/fusion"]
cuda = ["burn/cuda", "burn/fusion"]
# Reverse-mode automatic differentiation (examples/ad_bench.rs).
autodiff = ["burn/autodiff"]

[[example]]
name = "ad_bench"
required-features = ["wgpu", "autodiff"]

[[example]]
name = "adjoint_week"
required-features = ["wgpu", "autodiff"]
